name: aicte-fire-classification
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.24.3
  - pandas=1.5.3
  - scipy=1.10.1
  - scikit-learn=1.2.2
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - jupyter=1.0.0
  - notebook=6.5.4
  - ipykernel=6.25.2
  - pytest=7.4.0
  - pytest-cov=4.1.0
  - flake8=6.1.0
  - black=24.4.0
  - isort=5.13.0
  - pip
  - pip::xgboost==1.7.6
  - pip::nbstripout==0.5.0
  - pip::pre-commit==3.5.0

variables:
  PYTHONPATH: .
